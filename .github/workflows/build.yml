name: Build ZockArchive Docker Image

on:
  # push:
  #   tags:
  #     - "[0-9]+.[0-9]+.[0-9]+*"
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate-tag-semver:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      valid: ${{ steps.check_tag.outputs.valid }}
      normalized: ${{ steps.check_tag.outputs.normalized }}
    steps:
      - name: Check if tag follows SemVer
        id: check_tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          TAG="$RELEASE_TAG"
          NORMALIZED_TAG="${TAG#v}"
          if [[ "$TAG" =~ ^v?0\.1\.0-beta\.1$ ]]; then
            echo "valid=true" >> $GITHUB_OUTPUT
            echo "normalized=$NORMALIZED_TAG" >> $GITHUB_OUTPUT
          else
            echo "valid=false" >> $GITHUB_OUTPUT
            echo "normalized=" >> $GITHUB_OUTPUT
          fi

  build:
    needs: validate-tag-semver
    runs-on: ubuntu-latest
    if: needs.validate-tag-semver.outputs.valid == 'true'
    env:
      USE_DOCKERHUB: ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != '' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Run only once per release
        run: echo "Triggered by ${{ github.event_name }}"

      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Login to Docker Hub
        if: env.USE_DOCKERHUB == 'true'
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata (full)
        id: meta
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        with:
          # Stable Docker Hub alias for optional registry compatibility.
          # name=d1skanime/pc-game-download-portal
          images: |
            name=ghcr.io/d1skanime/zockarchive
            name=d1skanime/pc-game-download-portal,enable=${{ env.USE_DOCKERHUB == 'true' }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ needs.validate-tag-semver.outputs.normalized }}
            type=raw,value=beta
          labels: |
            org.opencontainers.image.version=${{ needs.validate-tag-semver.outputs.normalized }}
            org.opencontainers.image.title="ZockArchive"
            org.opencontainers.image.description="ZockArchive provides a self-hosted PC and console game library with metadata, media, and managed downloads."
            org.opencontainers.image.source=https://github.com/D1skanime/zockarchive
            org.opencontainers.image.licenses="AGPLv3"

      - name: Set version
        run: |
          sed -i 's/<version>/${{ needs.validate-tag-semver.outputs.normalized }}/' backend/__version__.py

      - name: Build full image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          file: docker/Dockerfile
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          target: full-image
          build-args: |
            SCREENSCRAPER_DEV_ID=${{ secrets.SCREENSCRAPER_DEV_ID }}
            SCREENSCRAPER_DEV_PASSWORD=${{ secrets.SCREENSCRAPER_DEV_PASSWORD }}

      - name: Generate Docker metadata (slim)
        id: meta-slim
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        with:
          # Stable Docker Hub alias for optional registry compatibility.
          # name=d1skanime/pc-game-download-portal
          images: |
            name=ghcr.io/d1skanime/zockarchive
            name=d1skanime/pc-game-download-portal,enable=${{ env.USE_DOCKERHUB == 'true' }}
          flavor: |
            latest=false
            suffix=-slim,onlatest=true
          tags: |
            type=raw,value=${{ needs.validate-tag-semver.outputs.normalized }}
            type=raw,value=beta
          labels: |
            org.opencontainers.image.version=${{ needs.validate-tag-semver.outputs.normalized }}
            org.opencontainers.image.title="ZockArchive"
            org.opencontainers.image.description="ZockArchive provides a self-hosted PC and console game library with metadata, media, and managed downloads."
            org.opencontainers.image.source=https://github.com/D1skanime/zockarchive
            org.opencontainers.image.licenses="AGPLv3"

      - name: Build slim image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          file: docker/Dockerfile
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta-slim.outputs.tags }}
          labels: ${{ steps.meta-slim.outputs.labels }}
          target: slim-image
          build-args: |
            SCREENSCRAPER_DEV_ID=${{ secrets.SCREENSCRAPER_DEV_ID }}
            SCREENSCRAPER_DEV_PASSWORD=${{ secrets.SCREENSCRAPER_DEV_PASSWORD }}
